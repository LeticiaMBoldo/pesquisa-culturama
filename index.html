<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Icon" href="culturama-favico.png" type="image/x-icon">
    <!-- <link rel="stylesheet" href="css/reset.css"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="Logo Culturama">
            <h1>Pesquisa de opinião</h1>
        </header>
        <section>
            <form action="sucesso.html" method="get">
                <fieldset>
                    <!-- Dados Pessoais -->
                    <legend>Dados Pessoais</legend>
                    <label for="name">Nome</label>
                    <input type="text" name="userName" id="name" required>
                    <br>

                    <label for="age">Idade</label>
                    <input type="number" id="age" name="userAge" min="12" max="100" required>
                    <br>

                    <label for="birthDate">Data de nascimento</label>
                    <input type="date" name="userBirthDate" id="birthDate">
                    <br>

                    <label for="email">Email</label>
                    <input type="email" name="userEmail" id="email">
                    <br>

                    <label for="phone">Telefone</label>
                    <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" aria-describedby="phoneHelp"
                        placeholder="()____-____" id="phone">
                    <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número sem espaços ou hífen.</small>
                    <br>

                    <label for="image">Upload de fotos</label>
                    <input type="file" name="userImage" accept="image/*" id="image" aria-describedby="imageHelp">
                    <small id="imageHelp">Envie uma foto no formato PNG ou JPEG</small>
                    <br>
                </fieldset>
                <fieldset>
                    <!-- Dados de perfil -->
                    <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <input type="radio" name="userGender" value="Feminino" id="fem">
                    <label for="fem">Feminino</label>
                    <input type="radio" name="userGender" value="Masculino" id="masc">
                    <label for="masc">Masculino</label>
                    <input type="radio" name="userGender" value="notInformed" id="notInformed">
                    <label for="notInformed">Prefiro não informar</label>
                    <br>

                    <label for="maritalStatus">Estado cívil</label>
                    <select id="maritalStatus" name="userMaritalStatus">
                        <option value="norInformed">Selecione...</option>
                        <option value="Married">Casado(a)</option>
                        <option value="Single">Solteiro(a)</option>
                        <option value="Divorced">Divorciado(o)</option>
                        <option value="Stable_union">União estável</option>
                        <option value="Widower">Viúvo(a)</option>
                    </select>
                    <br>

                    <label for="state">Estados:</label>
                    <select id="state" name="userState" required>
                        <option value="acre">Acre</option>
                        <option value="alagoas">Alagoas</option>
                        <option value="amapa">Amapá</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="bahia">Bahia</option>
                        <option value="ceara">Ceará</option>
                        <option value="distritoFederal">Distrito Federal</option>
                        <option value="espiritoSanto">Espirito Santo</option>
                        <option value="goias">Goiás</option>
                        <option value="maranhao">Maranhão</option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                        <option value="matoGrosso">Mato Grosso</option>
                        <option value="minasGerais">Minas Gerais</option>
                        <option value="para">Pará</option>
                        <option value="paraiba">Paraíba</option>
                        <option value="parana">Paraná</option>
                        <option value="pernambuco">Pernambuco</option>
                        <option value="piaui">Piauí</option>
                        <option value="rioDeJaneiro">Rio de Janeiro</option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="roraima">Roraima</option>
                        <option value="santaCatarina">Santa Catarina</option>
                        <option value="saoPaulo">São Paulo</option>
                        <option value="sergipe">Sergipe</option>
                        <option value="tocantins">Tocantins</option>
                    </select>
                    <br>

                    <label for="city">Cidade:</label>
                    <input type="text" id="city" name="userCity" placeholder="Ex.: Fortaleza"
                        autocomplete="address-level2">
                </fieldset>
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais:</p>
                    <input type="checkbox" name="social" id="instagram" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input type="checkbox" name="social" id="facebook" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input type="checkbox" name="social" id="linkedin" value="Linkedin">
                    <label for="linkedin">Linkedin</label>
                    <br>
                    <input type="checkbox" name="social" id="x" value="X">
                    <label for="x">X</label>
                    <br>

                    <label for="musicStyle">Estilo musical:</label>
                    <input type="text" name="userMusicStyle" id="musicStyle" list="styleTypes">
                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Pop">
                        <option value="Samba">
                        <option value="Sertanejo">
                    </datalist>
                    <br>

                    <label for="favoriteColor">Cor favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                    <br>
                </fieldset>

                <fieldset>
                    <legend>Opinião</legend>
                    <p>O que você acha da qualidade do nosso serviço?</p>
                    <input type="radio" name="userServiceOpinion" id="excellent" value="Ótima">
                    <label for="excellent">Ótima</label>
                    <br>
                    <input type="radio" name="userServiceOpinion" id="great" value="Boa">
                    <label for="great">Boa</label>
                    <br>
                    <input type="radio" name="userServiceOpinion" id="normal" value="Regular">
                    <label for="normal">Regular</label>
                    <br>
                    <input type="radio" name="userServiceOpinion" id="bad" value="Ruim">
                    <label for="bad">Ruim</label>
                    <br>
                    <br>

                    <label for="comment">Escreva sua opinião</label>
                    <Textarea id="comment" name="userComment" placeholder="Explique o porque da avaliação anterior...">
                    </Textarea>

                </fieldset>
                <fieldset>
                    <legend>Confirmações</legend>
                    <input type="checkbox" name="UserLGPD" id="userLgpdTerm" value="aceepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                    <br>
                    <input type="checkbox" name="userGetResult" id="getResult" value="aceepted">
                    <label for="getResult">Desejo receber o resultado por email</label>
                </fieldset>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>
</body>

</html>
