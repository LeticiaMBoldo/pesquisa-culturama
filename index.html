<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
    <!-- <link rel="stylesheet" href="css/reset.css"> -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <!-- Dados Pessoais -->
                <legend>Dados Pessoais</legend>
                <label for="userName">Nome</label>
                <input type="text" name="userName" required>
                <br>

                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="12" max="100" required>
                <br>

                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate">
                <br>

                <label for="userEmail">Email</label>
                <input type="email" name="userEmail">
                <br>

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="()____-____">
                <br>

                <label for="userImage">Upload de fotos</label>
                <input type="file" name="userImage" accept="image/*">
                <br>
            </fieldset>
            <fieldset>
                <!-- Dados de perfil -->
                <legend>Perfil</legend>
                <p>Gênero:</p>
                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>
                <input type="radio" name="userGender" value="Masculino">
                <label for="userGender">Masculino</label>
                <input type="radio" name="userGender" value="notInformed">
                <label for="userGender">Prefiro não informar</label>

                <label for="maritalStatus">Estado cívil</label>
                <select name="maritalStatus">
                    <option value="norInformed">Selecione...</option>
                    <option value="Married">Casado(a)</option>
                    <option value="Single">Solteiro(a)</option>
                    <option value="Divorced">Divorciado(o)</option>
                    <option value="Stable_union">União estável</option>
                    <option value="Widower">Viúvo(a)</option>
                </select>
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>

</html>
